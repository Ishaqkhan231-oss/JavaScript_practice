<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Age Calculator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f0f4f8;
      color: #333;
    }
    header { font-size: 13px; color: #888; margin-bottom: 30px; }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }
    h1 { font-size: 20px; margin-bottom: 20px; }
    label { font-size: 13px; color: #666; display: block; margin-bottom: 6px; text-align: left; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #result { margin-top: 16px; font-size: 15px; color: #4f46e5; font-weight: bold; min-height: 22px; }
    footer { font-size: 12px; color: #aaa; margin-top: 30px; }
  </style>
</head>
<body>
  <header>Created by Muhammad Ishaq</header>
  <div class="card">
    <h1>Age Calculator</h1>
    <label>Enter Your Date of Birth</label>
    <input type="date" id="dob">
    <button onclick="calcAge()">Calculate Age</button>
    <div id="result"></div>
  </div>
  <footer>&copy; All Rights Reserved 2026</footer>
  <script>
    document.getElementById('dob').max = new Date().toISOString().split('T')[0];
    function calcAge() {
      const dob = new Date(document.getElementById('dob').value);
      if (!dob.getTime()) return document.getElementById('result').textContent = 'Please select a date.';
      const today = new Date();
      let y = today.getFullYear() - dob.getFullYear();
      let m = today.getMonth() - dob.getMonth();
      let d = today.getDate() - dob.getDate();
      if (d < 0) { m--; d += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
      if (m < 0) { y--; m += 12; }
      document.getElementById('result').textContent = `You are ${y} years, ${m} months & ${d} days old.`;
    }
  </script>
</body>
</html>
